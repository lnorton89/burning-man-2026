<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Not found · Burning Man 2026</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #14100d;
        --text: #f3ece0;
        --muted: #b3a595;
        --accent: #ff7a3d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      h1 {
        font-size: clamp(1.6rem, 5vw, 2.4rem);
        background: linear-gradient(90deg, var(--accent), #ffd08a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
        border: 1px solid var(--accent);
        padding: 0.6rem 1.25rem;
        border-radius: 6px;
        display: inline-block;
      }
      a:hover {
        background: var(--accent);
        color: var(--bg);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>That one's not here</h1>
      <p>The photo or video you're looking for doesn't exist (or the link's off).</p>
      <a href="/burning-man-2026/">Back to the gallery</a>
    </div>
  </body>
</html>
